<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS vs AI Flywheel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            
            --saas-primary: #10b981; /* Emerald */
            --saas-gradient: linear-gradient(135deg, #059669 0%, #10b981 100%);
            --saas-glow: rgba(16, 185, 129, 0.2);
            
            --ai-primary: #f43f5e; /* Rose */
            --ai-gradient: linear-gradient(135deg, #e11d48 0%, #f43f5e 100%);
            --ai-glow: rgba(244, 63, 94, 0.2);

            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(244, 63, 94, 0.05) 0%, transparent 40%);
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .flywheel-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem 2rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .flywheel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--saas-gradient);
            opacity: 0.8;
        }

        .flywheel-card.ai-card::before {
            background: var(--ai-gradient);
        }

        .flywheel-card:hover {
            transform: translateY(-8px);
        }

        .saas-card:hover {
            box-shadow: 0 20px 40px var(--saas-glow);
        }

        .ai-card:hover {
            box-shadow: 0 20px 40px var(--ai-glow);
        }

        .title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 3rem;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .saas-title {
            background: var(--saas-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ai-title {
            background: var(--ai-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .step-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 1rem;
        }

        .step {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1rem 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 280px;
            text-align: center;
            font-weight: 500;
            font-size: 1.1rem;
            letter-spacing: 0.01em;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .step:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.02);
        }

        .saas-card .step.final-step {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #34d399;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
        }

        .ai-card .step.final-step {
            background: rgba(244, 63, 94, 0.1);
            border-color: rgba(244, 63, 94, 0.3);
            color: #fb7185;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.1);
        }

        .arrow {
            color: var(--text-muted);
            font-size: 1.5rem;
            animation: bounce 2s infinite;
            opacity: 0.5;
            z-index: 1;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-6px);
            }
            60% {
                transform: translateY(-3px);
            }
        }

        .arrow svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .saas-card .arrow {
            color: var(--saas-primary);
        }

        .ai-card .arrow {
            color: var(--ai-primary);
        }

        /* Abstract decorative elements */
        .decoration {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            z-index: 0;
            opacity: 0.4;
            pointer-events: none;
        }

        .saas-card .decoration {
            background: var(--saas-primary);
            width: 150px;
            height: 150px;
            top: -50px;
            right: -50px;
        }

        .ai-card .decoration {
            background: var(--ai-primary);
            width: 150px;
            height: 150px;
            bottom: -50px;
            left: -50px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- SaaS Flywheel -->
        <div class="flywheel-card saas-card">
            <div class="decoration"></div>
            <h2 class="title saas-title">Old SaaS Flywheel</h2>
            
            <div class="step-container">
                <div class="step">Build Software</div>
                <div class="arrow">
                    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                </div>
                <div class="step">Acquire Users</div>
                <div class="arrow" style="animation-delay: 0.2s">
                    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                </div>
                <div class="step">More Usage</div>
                <div class="arrow" style="animation-delay: 0.4s">
                    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                </div>
                <div class="step">Higher Retention</div>
                <div class="arrow" style="animation-delay: 0.6s">
                    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                </div>
                <div class="step final-step">Margins Improve</div>
            </div>
        </div>

        <!-- AI Flywheel -->
        <div class="flywheel-card ai-card">
            <div class="decoration"></div>
            <h2 class="title ai-title">AI Flywheel</h2>
            
            <div class="step-container">
                <div class="step">Train Model</div>
                <div class="arrow">
                    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                </div>
                <div class="step">Acquire Users</div>
                <div class="arrow" style="animation-delay: 0.2s">
                    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                </div>
                <div class="step">More Usage</div>
                <div class="arrow" style="animation-delay: 0.4s">
                    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                </div>
                <div class="step">More GPU Compute</div>
                <div class="arrow" style="animation-delay: 0.6s">
                    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                </div>
                <div class="step final-step">Higher Costs</div>
            </div>
        </div>

    </div>

</body>
</html>
