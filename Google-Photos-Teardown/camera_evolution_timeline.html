<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Evolution Timeline</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            background-color: #0f1115;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px;
        }

        .timeline-container {
            max-width: 800px;
            width: 100%;
            background: linear-gradient(145deg, #1a1d24, #121419);
            border-radius: 24px;
            padding: 60px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .header-text {
            text-align: center;
            margin-bottom: 50px;
        }

        .header-text h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #ffffff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-text p {
            color: #8b949e;
            font-size: 1rem;
            margin: 0;
        }

        .timeline {
            position: relative;
            padding-left: 40px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, #3b82f6, #8b5cf6, #ec4899, #f43f5e);
            border-radius: 3px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 48px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -48.5px; /* 40px padding + 3px line/2 - 16px dot/2 */
            top: 30px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #1a1d24;
            border: 3px solid #ffffff;
            z-index: 2;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .timeline-item:nth-child(1) .timeline-dot { border-color: #3b82f6; box-shadow: 0 0 12px rgba(59, 130, 246, 0.6); }
        .timeline-item:nth-child(2) .timeline-dot { border-color: #8b5cf6; box-shadow: 0 0 12px rgba(139, 92, 246, 0.6); }
        .timeline-item:nth-child(3) .timeline-dot { border-color: #ec4899; box-shadow: 0 0 12px rgba(236, 72, 153, 0.6); }
        .timeline-item:nth-child(4) .timeline-dot { border-color: #f43f5e; box-shadow: 0 0 12px rgba(244, 63, 94, 0.6); }

        .timeline-content {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px 28px;
            transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timeline-content:hover {
            transform: translateX(8px);
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .info-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .problem-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .problem-text {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin: 0;
        }
        
        .problem-badge {
            background: rgba(244, 63, 94, 0.15);
            color: #fb7185;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(244, 63, 94, 0.25);
        }

        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .timeline-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .icon-box {
                position: absolute;
                top: 24px;
                right: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="timeline-container">
        <div class="header-text">
            <h2>The Evolution of Photography</h2>
            <p>A shifting landscape of technological friction</p>
        </div>
        
        <div class="timeline">
            <!-- Era 1 -->
            <div class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="timeline-content">
                    <div class="info-group">
                        <h3 class="title">Film Camera</h3>
                        <div class="problem-wrapper">
                            <span class="problem-badge">Problem</span>
                            <p class="problem-text">Capture</p>
                        </div>
                    </div>
                    <div class="icon-box">🎞️</div>
                </div>
            </div>

            <!-- Era 2 -->
            <div class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="timeline-content">
                    <div class="info-group">
                        <h3 class="title">Digital Camera</h3>
                        <div class="problem-wrapper">
                            <span class="problem-badge">Problem</span>
                            <p class="problem-text">Storage</p>
                        </div>
                    </div>
                    <div class="icon-box">📷</div>
                </div>
            </div>

            <!-- Era 3 -->
            <div class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="timeline-content">
                    <div class="info-group">
                        <h3 class="title">Smartphone Camera</h3>
                        <div class="problem-wrapper">
                            <span class="problem-badge">Problem</span>
                            <p class="problem-text">Organization</p>
                        </div>
                    </div>
                    <div class="icon-box">📱</div>
                </div>
            </div>

            <!-- Era 4 -->
            <div class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="timeline-content">
                    <div class="info-group">
                        <h3 class="title">AI Photos</h3>
                        <div class="problem-wrapper">
                            <span class="problem-badge">Problem</span>
                            <p class="problem-text">Understanding & Retrieval</p>
                        </div>
                    </div>
                    <div class="icon-box">✨</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
