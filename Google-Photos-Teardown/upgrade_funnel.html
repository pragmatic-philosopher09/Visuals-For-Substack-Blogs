<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade Funnel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap');

        body {
            background-color: #fdfbf7;
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #000;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            margin-bottom: 24px;
            text-transform: uppercase;
            text-align: center;
        }

        .header h2 {
            font-size: 2.8rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -1.5px;
            text-shadow: 4px 4px 0px #93C5FD;
            border-bottom: 5px solid #000;
            display: inline-block;
            padding-bottom: 8px;
        }

        .funnel-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: relative;
        }

        /* The continuous spine */
        .funnel-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            background: #000;
            z-index: 0;
        }

        .step-card {
            width: 100%;
            max-width: 450px;
            border: 4px solid #000;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 6px 6px 0px #000;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
            position: relative;
            background: #fff;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 1;
            margin-bottom: 16px;
        }

        .step-card:last-child {
            margin-bottom: 0;
        }

        .step-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 10px 10px 0px #000;
        }

        .step-num {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            background: #000;
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 800;
            border: 3px solid #fff;
            box-shadow: 3px 3px 0px #000;
        }

        .step-content h3 {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        /* Colors & Rotations for playful brutalism */
        .bg-1 { background-color: #A7F3D0; transform: rotate(-1deg); } /* Green: starting fresh */
        .bg-2 { background-color: #FF90E8; transform: rotate(1.5deg); } /* Pink: emotional */
        .bg-3 { background-color: #93C5FD; transform: rotate(-0.5deg); } /* Blue: time passing/growing */
        .bg-4 { background-color: #FFE358; transform: rotate(1deg); } /* Yellow: warning limit */
        
        /* The final decision card */
        .bg-decision { 
            background-color: #000; 
            color: #fff;
            transform: rotate(0deg);
            max-width: 550px; 
            box-shadow: 8px 8px 0px #FCA5A5; 
            margin-top: 10px;
            padding: 20px;
        }

        .bg-decision .step-num {
            background: #FCA5A5;
            color: #000;
            box-shadow: none;
            border-color: #000;
        }

        .bg-decision:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0px #FCA5A5;
        }

        .bg-1:hover { transform: translate(-4px, -4px) rotate(-1deg); }
        .bg-2:hover { transform: translate(-4px, -4px) rotate(1.5deg); }
        .bg-3:hover { transform: translate(-4px, -4px) rotate(-0.5deg); }
        .bg-4:hover { transform: translate(-4px, -4px) rotate(1deg); }

        /* Responsive */
        @media (max-width: 600px) {
            .step-card {
                flex-direction: column;
                text-align: center;
                padding: 24px;
            }
            .step-num {
                margin-bottom: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>The Upgrade Funnel</h2>
        </div>

        <div class="funnel-wrapper">
            
            <div class="step-card bg-1">
                <div class="step-num">1</div>
                <div class="step-content">
                    <h3>Store memories</h3>
                </div>
            </div>

            <div class="step-card bg-2">
                <div class="step-num">2</div>
                <div class="step-content">
                    <h3>Build emotional dependence</h3>
                </div>
            </div>

            <div class="step-card bg-3">
                <div class="step-num">3</div>
                <div class="step-content">
                    <h3>Library grows over years</h3>
                </div>
            </div>

            <div class="step-card bg-4">
                <div class="step-num">4</div>
                <div class="step-content">
                    <h3>Storage limit reached</h3>
                </div>
            </div>

            <div class="step-card bg-decision">
                <div class="step-num">!</div>
                <div class="step-content">
                    <h3>Upgrade decision</h3>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
