<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Journey Flow</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap');

        body {
            background-color: #fdfbf7;
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px;
            color: #000;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            text-align: center;
        }

        .header {
            margin-bottom: 60px;
            text-transform: uppercase;
        }

        .header h2 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -1px;
            text-shadow: 4px 4px 0px #A7F3D0;
            border-bottom: 5px solid #000;
            display: inline-block;
            padding-bottom: 8px;
        }

        .flow-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: nowrap;
        }

        .card {
            flex: 1;
            min-width: 140px;
            border: 4px solid #000;
            border-radius: 8px;
            padding: 30px 20px;
            box-shadow: 6px 6px 0px #000;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
            position: relative;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 10px 10px 0px #000;
        }

        .step-num {
            position: absolute;
            top: -16px;
            left: -16px;
            width: 40px;
            height: 40px;
            background: #000;
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 800;
            border: 3px solid #fff;
            box-shadow: 3px 3px 0px #000;
        }

        .card h3 {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0;
            line-height: 1.2;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            word-wrap: break-word;
            hyphens: auto;
        }

        /* Distinct Neo-Brutalist Colors */
        .card-1 { background-color: #FF90E8; transform: rotate(-1deg); } /* Pink */
        .card-2 { background-color: #93C5FD; transform: rotate(1deg); }  /* Blue */
        .card-3 { background-color: #FFE358; transform: rotate(-0.5deg); } /* Yellow */
        .card-4 { background-color: #A7F3D0; transform: rotate(1.5deg); }  /* Green */
        .card-5 { background-color: #FCA5A5; transform: rotate(-1.5deg); } /* Red */

        /* Prevent transform override on hover for rotated cards */
        .card-1:hover { transform: translate(-4px, -4px) rotate(-1deg); }
        .card-2:hover { transform: translate(-4px, -4px) rotate(1deg); }
        .card-3:hover { transform: translate(-4px, -4px) rotate(-0.5deg); }
        .card-4:hover { transform: translate(-4px, -4px) rotate(1.5deg); }
        .card-5:hover { transform: translate(-4px, -4px) rotate(-1.5deg); }

        .arrow {
            font-size: 2.5rem;
            font-weight: 800;
            color: #000;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        @media (max-width: 900px) {
            .flow-wrapper {
                flex-direction: column;
                gap: 30px;
            }
            .card {
                width: 100%;
                max-width: 300px;
            }
            .arrow {
                transform: rotate(90deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>User Journey Flow</h2>
        </div>

        <div class="flow-wrapper">
            <div class="card card-1">
                <div class="step-num">1</div>
                <h3>Trigger</h3>
            </div>
            
            <div class="arrow">➔</div>
            
            <div class="card card-2">
                <div class="step-num">2</div>
                <h3>Activation</h3>
            </div>

            <div class="arrow">➔</div>
            
            <div class="card card-3">
                <div class="step-num">3</div>
                <h3>Value<br>Discovery</h3>
            </div>

            <div class="arrow">➔</div>
            
            <div class="card card-4">
                <div class="step-num">4</div>
                <h3>Habit<br>Formation</h3>
            </div>

            <div class="arrow">➔</div>
            
            <div class="card card-5">
                <div class="step-num">5</div>
                <h3>Monetization</h3>
            </div>
        </div>
    </div>
</body>
</html>
