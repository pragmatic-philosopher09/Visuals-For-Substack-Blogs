<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Need Spectrum</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

        body {
            background-color: #fdfbf7;
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px;
            color: #000;
        }

        .spectrum-container {
            width: 100%;
            max-width: 900px;
            position: relative;
            padding: 40px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 80px;
            text-transform: uppercase;
        }

        .header h2 {
            font-size: 2.8rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -1.5px;
            text-shadow: 4px 4px 0px #FF90E8;
            border-bottom: 5px solid #000;
            display: inline-block;
            padding-bottom: 5px;
            position: relative;
        }

        /* The chunky spectrum track */
        .spectrum-track {
            position: absolute;
            top: 60%;
            left: 0;
            width: 100%;
            height: 16px;
            background: #000;
            z-index: 1;
            box-shadow: 0 8px 0px rgba(0,0,0,0.1);
        }

        .spectrum-track::before, .spectrum-track::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            background: #fff;
            border: 4px solid #000;
            border-radius: 50%;
            z-index: 2;
        }

        .spectrum-track::before { left: -16px; }
        .spectrum-track::after { right: -16px; }

        .cards-wrapper {
            display: flex;
            justify-content: space-between;
            position: relative;
            z-index: 2;
            gap: 60px;
        }

        .brutalist-card {
            flex: 1;
            border: 4px solid #000;
            border-radius: 8px;
            padding: 36px;
            box-shadow: 10px 10px 0px #000;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        /* Decorative tape effect */
        .brutalist-card::after {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%) rotate(-3deg);
            width: 80px;
            height: 30px;
            background: rgba(255,255,255,0.4);
            border: 2px solid #000;
            box-shadow: 2px 2px 0px #000;
        }

        .brutalist-card:hover {
            transform: translate(-4px, -4px) rotate(0deg);
            box-shadow: 14px 14px 0px #000;
        }

        .card-left {
            background-color: #FFE358; /* Vibrant Yellow */
            transform: rotate(-1.5deg);
        }

        .card-right {
            background-color: #A7F3D0; /* Mint Green */
            transform: rotate(1.5deg);
        }

        .pill {
            display: inline-block;
            border: 3px solid #000;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            background: #fff;
            margin-bottom: 24px;
            box-shadow: 4px 4px 0px #000;
            letter-spacing: -0.5px;
        }

        h3 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 24px 0;
            line-height: 1.1;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            line-height: 1.3;
        }

        li::before {
            content: '✦';
            font-weight: bold;
            font-size: 1.3rem;
            color: #000;
            margin-top: -2px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .cards-wrapper {
                flex-direction: column;
                gap: 40px;
            }
            .spectrum-track {
                width: 16px;
                height: 100%;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
            }
            .spectrum-track::before { top: -16px; left: -4px; }
            .spectrum-track::after { top: auto; bottom: -16px; left: -4px; }
            .brutalist-card {
                transform: none !important;
            }
            .brutalist-card::after {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="spectrum-container">
        <div class="header">
            <h2>User Need Spectrum</h2>
        </div>

        <!-- The thick line connecting the two paradigms -->
        <div class="spectrum-track"></div>

        <div class="cards-wrapper">
            <!-- Left Side -->
            <div class="brutalist-card card-left">
                <div class="pill">“Do it for me”</div>
                <h3>Low Effort Users</h3>
                <ul>
                    <li>AI suggestions</li>
                    <li>Auto albums</li>
                    <li>Memories feed</li>
                </ul>
            </div>

            <!-- Right Side -->
            <div class="brutalist-card card-right">
                <div class="pill">“Let me control it”</div>
                <h3>High Control Users</h3>
                <ul>
                    <li>Manual editing</li>
                    <li>Custom organization</li>
                    <li>Precise retrieval</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
