<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripe Workbench vs Entity Graph</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg-slate: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-violet: #8b5cf6;
            --success-green: #10b981;
            
            /* Node specific colors */
            --node-bg: rgba(30, 41, 59, 0.7);
            --node-border: rgba(139, 92, 246, 0.3);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--bg-slate);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header / Title Bar */
        .app-header {
            height: 56px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            z-index: 50;
        }
        
        .badge {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Main Split View */
        .split-view {
            display: flex;
            flex: 1;
            height: calc(100vh - 56px - 60px); /* Leave room for header and footer */
            position: relative;
        }

        /* Left Side: Developer Logs UI */
        .logs-panel {
            width: 45%;
            border-right: 1px solid var(--border);
            background: #0b1120;
            display: flex;
            flex-direction: column;
            z-index: 20;
        }

        .logs-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
        }

        .event-item {
            padding: 14px 24px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.4);
            display: flex;
            align-items: flex-start;
            gap: 16px;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }
        
        .event-item:hover, .event-item.active {
            background: rgba(139, 92, 246, 0.1);
        }
        
        .event-item.active::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--accent-violet);
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--success-green);
            margin-top: 6px;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }

        .event-details {
            flex: 1;
        }

        .event-type {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #a78bfa;
            margin-bottom: 6px;
        }

        .event-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 16px;
        }

        .http-status {
            color: var(--success-green);
            font-weight: 500;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Right Side: Entity Node Graph */
        .graph-panel {
            width: 55%;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .graph-grid {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(139, 92, 246, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        #connection-lines {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .pipeline {
            fill: none;
            stroke: url(#violet-gradient);
            stroke-width: 3;
            stroke-linecap: round;
            opacity: 0.7;
        }

        .pipeline-glow {
            fill: none;
            stroke: var(--accent-violet);
            stroke-width: 10;
            stroke-linecap: round;
            opacity: 0.2;
            filter: blur(6px);
        }

        .particle {
            fill: #d8b4fe;
            filter: drop-shadow(0 0 6px #d8b4fe);
        }

        .diagram-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* The Nodes */
        .node {
            position: absolute;
            width: 180px;
            background: var(--node-bg);
            border: 1px solid var(--node-border);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .node.active {
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            border-color: var(--accent-violet);
            transform: scale(1.05);
            z-index: 20;
        }

        .node h3 {
            margin: 0 0 4px 0;
            font-size: 14px;
            font-weight: 600;
            color: #f8fafc;
        }
        
        .node p {
            margin: 0;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Pseudo-Isometric Layout */
        #node-customer { top: 15%; left: 10%; }
        #node-subscription { top: 35%; left: 30%; }
        #node-invoice { top: 15%; left: 55%; }
        #node-payment { top: 55%; left: 75%; }
        #node-webhook { top: 75%; left: 45%; }
        #node-invoice-paid { top: 35%; left: 80%; } /* Added to match sequence */

        /* Footer / Caption */
        .figure-caption {
            height: 60px;
            background: #0f172a;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-muted);
            z-index: 50;
        }

        .figure-caption strong {
            color: var(--text-main);
            font-weight: 600;
            margin-right: 6px;
        }

    </style>
</head>
<body>

    <div class="app-header">
        Stripe Workbench <span class="badge">Live</span>
    </div>

    <div class="split-view">
        
        <!-- Developer Logs Panel -->
        <div class="logs-panel">
            <div class="logs-header">
                Event Logs
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <div class="event-list" id="event-list">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Isometric Node Graph Panel -->
        <div class="graph-panel">
            <div class="graph-grid"></div>
            
            <svg id="connection-lines">
                <defs>
                    <linearGradient id="violet-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#8b5cf6" />
                        <stop offset="100%" stop-color="#c084fc" />
                    </linearGradient>
                </defs>
                <g id="paths-group"></g>
                <g id="particles-group"></g>
            </svg>

            <div class="diagram-container">
                <div class="node" id="node-customer" data-event="0">
                    <h3>Customer</h3>
                    <p>Core entity created</p>
                </div>
                <div class="node" id="node-subscription" data-event="1">
                    <h3>Subscription</h3>
                    <p>Pricing attached</p>
                </div>
                <div class="node" id="node-invoice" data-event="2,3">
                    <h3>Invoice</h3>
                    <p>Drafted & Finalized</p>
                </div>
                <div class="node" id="node-payment" data-event="4">
                    <h3>PaymentIntent</h3>
                    <p>Funds captured</p>
                </div>
                <div class="node" id="node-webhook" style="display:none;">
                    <h3>Webhook</h3>
                    <p>Fired to merchant</p>
                </div>
            </div>
        </div>

    </div>

    <div class="figure-caption">
        <strong>Figure 3:</strong> The underlying object state machine that executes every subscription cycle.
    </div>

    <script>
        // Event Data
        const events = [
            { type: "customer.created", time: "14:52:01.012", target: "node-customer" },
            { type: "customer.subscription.created", time: "14:52:01.450", target: "node-subscription" },
            { type: "invoice.created", time: "14:52:01.890", target: "node-invoice" },
            { type: "invoice.finalized", time: "14:52:02.100", target: "node-invoice" },
            { type: "payment_intent.succeeded", time: "14:52:03.540", target: "node-payment" },
            { type: "invoice.paid", time: "14:52:03.620", target: "node-invoice" } // Points back to invoice
        ];

        const eventList = document.getElementById('event-list');
        const nodes = {
            'node-customer': document.getElementById('node-customer'),
            'node-subscription': document.getElementById('node-subscription'),
            'node-invoice': document.getElementById('node-invoice'),
            'node-payment': document.getElementById('node-payment')
        };

        // Graph Connections sequence matching the logs
        const connections = [
            { from: 'node-customer', to: 'node-subscription' },
            { from: 'node-subscription', to: 'node-invoice' },
            { from: 'node-invoice', to: 'node-payment' },
            { from: 'node-payment', to: 'node-invoice' } // Loop back for invoice.paid
        ];

        // Populate Left Panel
        events.forEach((ev, idx) => {
            const item = document.createElement('div');
            item.className = 'event-item';
            item.innerHTML = `
                <div class="status-dot"></div>
                <div class="event-details">
                    <div class="event-type">${ev.type}</div>
                    <div class="event-meta">
                        <span class="http-status">200 OK</span>
                        <span>${ev.time}</span>
                    </div>
                </div>
            `;
            
            // Hover logic to highlight nodes
            item.addEventListener('mouseenter', () => {
                document.querySelectorAll('.event-item').forEach(el => el.classList.remove('active'));
                item.classList.add('active');
                
                document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
                if(nodes[ev.target]) {
                    nodes[ev.target].classList.add('active');
                }
            });
            
            eventList.appendChild(item);
        });

        // Initialize SVG Pipelines
        const pathsGroup = document.getElementById('paths-group');
        const particlesGroup = document.getElementById('particles-group');
        const mainPaths = [];

        function initConnections() {
            connections.forEach((conn, index) => {
                // Glow
                const glowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                glowPath.setAttribute('class', 'pipeline-glow');
                glowPath.setAttribute('id', `glow-${index}`);
                pathsGroup.appendChild(glowPath);

                // Main
                const mainPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                mainPath.setAttribute('class', 'pipeline');
                mainPath.setAttribute('id', `path-${index}`);
                pathsGroup.appendChild(mainPath);
                mainPaths.push({ glow: glowPath, main: mainPath });

                // Particle
                const particle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                particle.setAttribute('r', '3');
                particle.setAttribute('class', 'particle');
                
                const animateMotion = document.createElementNS('http://www.w3.org/2000/svg', 'animateMotion');
                animateMotion.setAttribute('dur', '3s');
                animateMotion.setAttribute('repeatCount', 'indefinite');
                
                const mpath = document.createElementNS('http://www.w3.org/2000/svg', 'mpath');
                mpath.setAttribute('href', `#path-${index}`);
                
                animateMotion.appendChild(mpath);
                particle.appendChild(animateMotion);
                particlesGroup.appendChild(particle);
            });
        }

        function getCenter(el) {
            if(!el) return {x:0, y:0};
            const container = document.querySelector('.diagram-container').getBoundingClientRect();
            const rect = el.getBoundingClientRect();
            return {
                x: (rect.left - container.left) + rect.width / 2,
                y: (rect.top - container.top) + rect.height / 2
            };
        }

        function updateConnections() {
            connections.forEach((conn, index) => {
                const c1 = getCenter(nodes[conn.from]);
                const c2 = getCenter(nodes[conn.to]);
                
                let d = '';
                // If it's a loop back (payment to invoice) make an arc
                if(conn.from === 'node-payment' && conn.to === 'node-invoice') {
                    d = `M ${c1.x} ${c1.y} Q ${c1.x} ${c2.y - 100} ${c2.x} ${c2.y}`;
                } else {
                    const midX = (c1.x + c2.x) / 2;
                    d = `M ${c1.x} ${c1.y} C ${midX} ${c1.y}, ${midX} ${c2.y}, ${c2.x} ${c2.y}`;
                }

                if(mainPaths[index]) {
                    mainPaths[index].main.setAttribute('d', d);
                    mainPaths[index].glow.setAttribute('d', d);
                }
            });
        }

        // Run setup and render
        initConnections();
        
        // Use a ResizeObserver instead of requestAnimationFrame since nodes don't float here
        const resizeObserver = new ResizeObserver(() => {
            updateConnections();
        });
        document.querySelectorAll('.node').forEach(n => resizeObserver.observe(n));
        resizeObserver.observe(document.querySelector('.diagram-container'));

        // Initial default state
        setTimeout(() => {
            document.querySelector('.event-item').dispatchEvent(new MouseEvent('mouseenter'));
        }, 500);

    </script>
</body>
</html>
